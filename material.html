    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #f1f5f9; }
        .tag-A { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .tag-B { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .tag-C { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .data-table tr:hover { background-color: #f8fafc; }
        .clean-report { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @media print { .no-print { display: none !important; } body { background: white; } }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .chat-animate { animation: fadeInScale 0.3s ease-out; }
        @keyframes pulse-custom {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }

        let currentSort = { key: 'suggest', asc: true };
        let chartInstance = null;
        const scoreMap = { 'A': 1, 'B': 2, 'C': 3 };

        // 智慧清洗與標準化邏輯
        function normalizeLabel(v) {
            if (!v) return 'A';
            const s = v.toString().toUpperCase().trim();
            if (s.includes('1') || s.includes('A')) return 'A';
            if (s.includes('2') || s.includes('B')) return 'B';
            if (s.includes('3') || s.includes('C')) return 'C';
            return 'A';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => parseAndCleanCsv(e.target.result);
            reader.readAsText(file);
        }

        function parseAndCleanCsv(csv) {
            const lines = csv.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) return;

            const headers = lines[0].split(',').map(h => h.trim());
            const mapping = {};
            headers.forEach((h, i) => {
                if (/原料|raw/i.test(h) && !/替代/i.test(h)) mapping.raw = i;
                else if (/替代/i.test(h) || /sub/i.test(h)) mapping.sub = i;
                else if (/風味|impact/i.test(h)) mapping.impact = i;
                else if (/成本|cost/i.test(h)) mapping.cost = i;
                else if (/建議|suggest/i.test(h)) mapping.suggest = i;
            });

            let rawCount = 0, emptyCount = 0, duplicateCount = 0, invalidCostCount = 0;
            const seen = new Set();
            
            const cleaned = [];
            lines.slice(1).forEach(line => {
                rawCount++;
                const cols = line.split(',').map(c => c.trim());
                
                // 1. 檢查必要欄位是否為空
                const rawVal = cols[mapping.raw], subVal = cols[mapping.sub];
                if (!rawVal || !subVal) { emptyCount++; return; }

                // 2. 處理成本 (清洗非數字字元並檢查有效性)
                const costStr = cols[mapping.cost] || "0";
                const costVal = parseFloat(costStr.replace(/[^\d.-]/g, ''));
                if (isNaN(costVal) || costVal <= 0) { invalidCostCount++; return; }

                // 3. 標準化標籤
                const impactVal = normalizeLabel(cols[mapping.impact]);
                const suggestVal = normalizeLabel(cols[mapping.suggest]);

                // 4. 去重檢查 (基於原料、替代、成本、標籤的唯一組合)
                const fingerprint = `${rawVal}|${subVal}|${costVal}|${impactVal}|${suggestVal}`;
                if (seen.has(fingerprint)) { duplicateCount++; return; }
                seen.add(fingerprint);

                cleaned.push({
                    raw: rawVal,
                    sub: subVal,
                    impact: impactVal,
                    suggest: suggestVal,
                    cost: costVal
                });
            });

            allData = cleaned;
            showCleanReport(rawCount, emptyCount, duplicateCount, invalidCostCount);
            initSelects();
            updateDashboard();
        }

        function showCleanReport(total, empty, dup, inv) {
            const report = document.getElementById('cleanReport');
            const detail = document.getElementById('cleanDetail');
            report.classList.remove('hidden');
            detail.innerText = `總讀取 ${total} 筆，排除空值 ${empty} 筆、重複項 ${dup} 筆、成本異常 ${inv} 筆。最終保留 ${allData.length} 筆有效決策數據。`;
        }

        function initSelects() {
            const select = document.getElementById('rawSelect');
            const raws = [...new Set(allData.map(d => d.raw))].sort();
            select.innerHTML = '<option value="">-- 選擇原料 --</option>';
            raws.forEach(r => select.add(new Option(r, r)));
        }

        function updateDashboard() {
            const target = document.getElementById('rawSelect').value;
            const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
            const volume = parseFloat(document.getElementById('annualVolume').value) || 0;
            const search = document.getElementById('searchInput').value.toLowerCase();

            if (!target) return;

            let list = allData.filter(d => d.raw === target);
            if (search) list = list.filter(d => d.sub.toLowerCase().includes(search));

            list.sort((a, b) => {
                let va = a[currentSort.key], vb = b[currentSort.key];
                if (currentSort.key === 'impact' || currentSort.key === 'suggest') {
                    va = scoreMap[a[currentSort.key]]; vb = scoreMap[b[currentSort.key]];
                }
                return currentSort.asc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
            });

            renderUI(list, baseCost, volume);
            renderChart(list);
        }

        function renderUI(list, baseCost, volume) {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            document.getElementById('statCount').innerText = `${list.length} 筆`;

            list.forEach(d => {
                const saving = (baseCost - d.cost) * volume;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-bold text-slate-700">${d.sub}</td>
                    <td class="p-4 text-center"><span class="px-3 py-1 rounded-full text-[10px] font-black tag-${d.impact}">等級 ${d.impact}</span></td>
                    <td class="p-4 text-center"><span class="px-3 py-1 rounded-full text-[10px] font-black tag-${d.suggest}">建議 ${d.suggest}</span></td>
                    <td class="p-4 text-right font-mono font-bold">$${d.cost.toFixed(1)}</td>
                    <td class="p-4 text-right font-mono font-black ${saving >= 0 ? 'text-emerald-600' : 'text-rose-500'}">
                        $${Math.round(saving).toLocaleString()}
                    </td>
                `;
                body.appendChild(tr);
            });

            if (list.length > 0) {
                const top = [...list].sort((a, b) => scoreMap[a.suggest] - scoreMap[b.suggest] || a.cost - b.cost)[0];
                document.getElementById('bestResult').innerText = top.sub;
                document.getElementById('bestSavings').innerText = `$${Math.round((baseCost - top.cost) * volume).toLocaleString()}`;

                const cheap = [...list].sort((a, b) => a.cost - b.cost)[0];
                document.getElementById('cheapResult').innerText = cheap.sub;
                document.getElementById('cheapSavings').innerText = `$${Math.round((baseCost - cheap.cost) * volume).toLocaleString()}`;
            }
        }

        function renderChart(list) {
            const ctx = document.getElementById('scatterChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '替代方案',
                        data: list.map(d => ({ x: d.cost, y: scoreMap[d.impact], label: d.sub })),
                        backgroundColor: '#6366f1'
                    }]
                },
                options: {
                    scales: {
                        y: { reverse: true, min: 0.5, max: 3.5, ticks: { callback: v => ['', 'A', 'B', 'C'][v] } }
                    },
                    plugins: { tooltip: { callbacks: { label: (ctx) => `${ctx.raw.label}: $${ctx.raw.x}` } } }
                }
            });
        }

        function setSort(key) {
            if (currentSort.key === key) currentSort.asc = !currentSort.asc;
            else { currentSort.key = key; currentSort.asc = true; }
            updateDashboard();
        }
    </script>

    <script>
        // 強制執行初始化
        (function() {
            const checkAndInit = () => {
                if (typeof initSelects === "function" && typeof allData !== "undefined" && allData.length > 0) {
                    initSelects();
                    // 預設選擇第一個原料
                    const select = document.getElementById('rawSelect');
                    if (select && select.options.length > 1) {
                        select.selectedIndex = 1; 
                        updateDashboard();
                    }
                    console.log("預載數據初始化成功");
                } else {
                    setTimeout(checkAndInit, 100);
                }
            };
            checkAndInit();
        })();
    </script>
    
    <!-- AI 助手 -->
    <div id="aiAssistant" class="fixed bottom-8 right-8 z-50 no-print">
        <button onclick="toggleChat()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 active:scale-95 btn-pulse">
            <span class="text-2xl">🤖</span>
        </button>
        
        <div id="chatWindow" class="hidden absolute bottom-20 right-0 w-80 md:w-96 h-[500px] bg-white rounded-3xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden chat-animate">
            <!-- 聊天標頭 -->
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-xl">🤖</span>
                    <div>
                        <h4 class="font-bold text-sm">RND 智慧助手</h4>
                        <p class="text-[10px] text-indigo-200">正在線為您分析數據</p>
                    </div>
                </div>
                <button onclick="toggleChat()" class="hover:bg-indigo-500 rounded-lg p-1 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 聊天內容區 -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
                <div class="flex gap-2">
                    <div class="bg-white p-3 rounded-2xl rounded-tl-none shadow-sm text-xs text-slate-700 max-w-[80%]">
                        您好！我是 RND 智慧助手。我可以幫您分析原料替代方案、估算成本節省，或解讀目前的研發圖表。請問有什麼我可以幫您的？
                    </div>
                </div>
            </div>

            <!-- 輸入區 -->
            <div class="p-4 bg-white border-t border-slate-100">
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="詢問關於原料或成本..." class="flex-1 bg-slate-100 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white p-2 rounded-xl hover:bg-indigo-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function toggleChat() {
            const window = document.getElementById('chatWindow');
            window.classList.toggle('hidden');
            if (!window.classList.contains('hidden')) {
                document.getElementById('chatInput').focus();
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            input.value = '';

            // 模擬 AI 回應
            setTimeout(() => {
                const response = generateAIResponse(msg);
                addMessage(response, 'ai');
            }, 600);
        }

        function addMessage(text, side) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = side === 'user' ? 'flex justify-end' : 'flex gap-2';
            
            const innerClass = side === 'user' 
                ? 'bg-indigo-600 text-white rounded-tr-none' 
                : 'bg-white text-slate-700 rounded-tl-none';

            div.innerHTML = `
                <div class="${innerClass} p-3 rounded-2xl shadow-sm text-xs max-w-[80%] animate-in fade-in slide-in-from-bottom-2 duration-300">
                    ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function generateAIResponse(query) {
            const target = document.getElementById('rawSelect').value;
            const baseCost = parseFloat(document.getElementById('baseCost').value) || 0;
            const volume = parseFloat(document.getElementById('annualVolume').value) || 0;

            if (query.includes('成本') || query.includes('省') || query.includes('錢')) {
                const bestSavings = document.getElementById('cheapSavings').innerText;
                const bestSub = document.getElementById('cheapResult').innerText;
                return `根據目前的分析，如果您選擇「${bestSub}」作為替代方案，預計每年最多可以節省 ${bestSavings}。這是在單位成本最低的情況下得出的結果。`;
            }

            if (query.includes('推薦') || query.includes('最好') || query.includes('建議')) {
                const bestResult = document.getElementById('bestResult').innerText;
                const bestSavings = document.getElementById('bestSavings').innerText;
                return `綜合考慮風味影響與成本，我最推薦「${bestResult}」。它在維持高品質風味的同時，還能為您節省約 ${bestSavings} 的年採購成本。`;
            }

            if (query.includes('數據') || query.includes('筆數')) {
                return `目前系統中共有 ${allData.length} 筆有效測試數據。針對目前選擇的「${target || '未選擇'}」，我們有 ${document.getElementById('statCount').innerText} 項替代方案可供選擇。`;
            }

            if (target) {
                return `針對您目前選擇的「${target}」，我可以為您提供成本效益分析或風味等級對比。您想了解具體的「成本節省」還是「綜合建議」？`;
            }

            return "我是一個人工智慧助手，專門協助研發數據分析。您可以詢問關於成本節省、最優推薦，或是如何解讀圖表。請先在上方選擇一個「原始原料」以便我為您進行深度分析。";
        }
    </script>
</body>
</html>
